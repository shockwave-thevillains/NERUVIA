<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelajaran (pratinjau) — NERUVIA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../assets/brand/neruvia-icon-cyan.svg">
<link rel="stylesheet" href="ruang.css">
<style>
main{max-width:820px}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted);display:inline-flex;align-items:center;min-height:44px}.crumb a:hover{color:var(--ink)}
h1{max-width:none;font-size:clamp(32px,4.8vw,52px);margin:16px 0 14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.pill{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;padding:5px 9px;border-radius:6px;background:var(--ink);color:#fff;border:1px solid var(--ink)}
.pill.xp{background:var(--cyan);border-color:var(--cyan)}
.pill.ok{background:transparent;color:var(--ink);border-color:var(--ink)}
.mprog{display:grid;gap:8px;margin-bottom:32px}
.mprog .t{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.track{height:10px;background:#fff;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--cyan);border-radius:999px;transition:width .6s var(--ease)}
.body{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3vw,36px);min-height:220px}
.body p{font-size:18px;color:var(--muted);max-width:60ch}
.body .draft{display:inline-block;margin-bottom:14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.body h2{font-size:22px;letter-spacing:-.01em;margin:26px 0 10px;color:var(--ink)}
.body h2:first-of-type{margin-top:0}
.body p+p{margin-top:12px}
.box{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
.box h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:400;margin-bottom:8px}
.box p{font-size:17px;color:#333}
.q{margin-top:18px;border:0}
.q legend{font-size:17px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:500 16px var(--f-main);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(27,127,75,.08)}
.opt.no{border-color:var(--bad);background:rgba(198,40,40,.08)}
.fb{margin-top:8px;font-size:15px;color:var(--muted);min-height:0}
.fb b{color:var(--ink)}
.score{margin-top:16px;font-family:var(--f-pixel);font-size:14px;color:var(--ink)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px;color:#333;font-size:17px}
.acts{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{font:600 16px var(--f-main);height:54px;padding:0 24px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:background .25s,color .25s,border-color .25s}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.btn.main[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.main:hover{filter:brightness(1.08)}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.nav2{margin-top:36px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live{min-height:24px;margin-top:14px;font-size:15px;color:var(--ink)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
.lat{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
.lat p{font-size:17px;color:#333}
.pq{margin-top:20px;border:0}
.pq legend{font-size:17px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.pair{display:grid;gap:10px}
@media(min-width:720px){.pair{grid-template-columns:1fr 1fr}}
.popt{text-align:left;font:500 16px var(--f-main);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:44px}
.popt:hover:not([aria-disabled=true]){border-color:var(--ink)}
.popt[aria-disabled=true]{cursor:default}
.popt.ok{border-color:var(--ok);background:rgba(27,127,75,.08)}
.popt.no{border-color:var(--bad);background:rgba(198,40,40,.08)}
.ptag{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pt{white-space:pre-wrap;overflow-wrap:anywhere}
.vd{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.latact{margin-top:18px}
.lat [hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#isi">Lewati ke isi</a>
<header>
  <div class="bar">
    <a class="brand" href="../index.html" aria-label="NERUVIA, kembali ke beranda"><svg viewBox="7 8 133 70" aria-hidden="true"><path d="M9,11 L31,11 L72.2,54.9 L85.4,75.2 L63.8,75.2 L26.5,42 L26.5,75.2 L9,75.2Z M58.3,13 L72.3,13 L94.5,41.5 L117,10.5 L136.7,10.5 L99.5,68.5Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" fill-rule="evenodd"/></svg>NERUVIA</a>
    <a class="back" href="index.html">← Ruang belajar</a>
  </div>
</header>
<main id="isi"><div class="empty" id="state">Memuat pelajaran…</div></main>
<script src="progress.js"></script>
<script>
(function(){
  var main=document.getElementById('isi');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function fail(msg){main.textContent='';var d=el('div','empty',msg);d.appendChild(document.createElement('br'));var a=el('a','','Kembali ke daftar level');a.href='index.html';a.style.cssText='color:var(--cyan);display:inline-flex;align-items:center;min-height:44px';d.appendChild(a);main.appendChild(d)}
  var id=new URLSearchParams(location.search).get('id')||'';
  fetch('../content/kursus.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var flat=[];d.level.forEach(function(l){l.modul.forEach(function(m){m.pelajaran.forEach(function(p){flat.push({l:l,m:m,p:p})})})});
    var i=-1;flat.forEach(function(x,k){if(x.p.id===id)i=k});
    if(i<0)return fail('Pelajaran tidak ditemukan.');
    show(flat,i);
  }).catch(function(){fail('Pelajaran gagal dimuat. Buka halaman ini lewat server (bukan file lokal) dan coba lagi.')});


  function box(title,text){var b=el('div','box');b.appendChild(el('h3','',title));b.appendChild(el('p','',text));return b}
  function okInter(x){
    function s(v,n){return typeof v==='string'&&v.trim()!==''&&v.length<=n}
    if(!x||typeof x!=='object'||!s(x.judul,120)||!s(x.petunjuk,500)||!Array.isArray(x.pasangan)||x.pasangan.length<1||x.pasangan.length>12)return false;
    return x.pasangan.every(function(q){return !!q&&typeof q==='object'&&s(q.skenario,400)&&s(q.a,900)&&s(q.b,900)&&s(q.alasan,700)&&(q.benar==='a'||q.benar==='b')&&Array.isArray(q.unsur)&&q.unsur.length<=8&&q.unsur.every(function(u){return s(u,60)})})
  }
  /* Latihan interaktif: pilih prompt yang lebih sesuai. Tanpa chatbot sungguhan, tanpa jaringan. Semua teks dari JSON lewat textContent. */
  function interaktif(x){
    if(!okInter(x))return null;
    var n=x.pasangan.length,wrap=el('section','lat'),right=0,answered=0,groups=[];
    var hid='lat-h';wrap.setAttribute('aria-labelledby',hid);
    wrap.appendChild(el('span','draft','// Latihan interaktif · Draf'));
    var h=el('h2','',x.judul);h.id=hid;wrap.appendChild(h);
    wrap.appendChild(el('p','',x.petunjuk));
    var score=el('p','score');score.setAttribute('role','status');score.setAttribute('aria-live','polite');
    var again=el('button','btn');again.type='button';again.textContent='Ulangi latihan';again.hidden=true;
    function fin(){
      var m=right===n?'Semua tepat. Coba terapkan unsur-unsur ini pada tugas nyata di latihan di atas.':right*3>=n*2?'Sudah baik. Baca ulang alasan pada situasi yang belum tepat.':'Baca ulang bagian pelajaran di atas, lalu coba lagi.';
      score.textContent='Skor: '+right+' dari '+n+'. '+m;again.hidden=false;
    }
    x.pasangan.forEach(function(q,qi){
      var fs=el('fieldset','pq'),lg=el('legend','',(qi+1)+'. '+q.skenario),pr=el('div','pair'),fb=el('p','fb');
      fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');
      fs.appendChild(lg);
      var btn={};
      ['a','b'].forEach(function(k){
        var b=el('button','popt');b.type='button';b.setAttribute('aria-pressed','false');
        b.appendChild(el('span','ptag','PROMPT '+k.toUpperCase()));b.appendChild(el('span','pt',q[k]));
        b.addEventListener('click',function(){
          if(fs.getAttribute('data-done')==='1')return;
          fs.setAttribute('data-done','1');
          var ok=k===q.benar;answered++;if(ok)right++;
          b.setAttribute('aria-pressed','true');
          ['a','b'].forEach(function(j){btn[j].setAttribute('aria-disabled','true')});
          btn[q.benar].classList.add('ok');btn[q.benar].appendChild(el('span','vd','Lebih sesuai'));
          if(!ok){b.classList.add('no');b.appendChild(el('span','vd','Pilihanmu, kurang sesuai'))}
          fb.textContent='';fb.appendChild(el('b','',ok?'Benar. ':'Belum tepat. '));
          fb.appendChild(document.createTextNode(q.alasan+(q.unsur.length?' Unsur yang membedakan: '+q.unsur.join(', ')+'.':'')));
          if(answered===n)fin();else score.textContent='Dijawab '+answered+' dari '+n;
        });
        btn[k]=b;pr.appendChild(b)});
      fs.appendChild(pr);fs.appendChild(fb);wrap.appendChild(fs);groups.push({fs:fs,btn:btn,fb:fb});
    });
    wrap.appendChild(score);
    var la=el('div','latact');la.appendChild(again);wrap.appendChild(la);
    again.addEventListener('click',function(){
      right=0;answered=0;score.textContent='';again.hidden=true;
      groups.forEach(function(g){
        g.fs.removeAttribute('data-done');g.fb.textContent='';
        ['a','b'].forEach(function(j){var b=g.btn[j];b.removeAttribute('aria-disabled');b.setAttribute('aria-pressed','false');b.classList.remove('ok','no');Array.prototype.slice.call(b.querySelectorAll('.vd')).forEach(function(v){b.removeChild(v)})})});
      groups[0].btn.a.focus();
    });
    return wrap;
  }
  function loadContent(p,body,ready){
    fetch('../content/pelajaran/'+encodeURIComponent(p.id)+'.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(c){
      body.textContent='';
      if(c.status==='draf')body.appendChild(el('span','draft','// Draf · belum disetujui'));
      body.appendChild(box('Tujuan',c.tujuan));
      c.bagian.forEach(function(g){var h=el('h2','',g.judul);body.appendChild(h);g.paragraf.forEach(function(t){body.appendChild(el('p','',t))})});
      if(c.contoh)body.appendChild(box(c.contoh.judul||'Contoh',c.contoh.teks));
      if(c.latihan)body.appendChild(box('Latihan',c.latihan.petunjuk));
      var lat=interaktif(c.interaktif);if(lat)body.appendChild(lat);
      if(c.cek&&c.cek.length){
        body.appendChild(el('h2','','Cek pemahaman'));
        var right=0,answered=0,score=el('p','score');score.setAttribute('role','status');score.setAttribute('aria-live','polite');
        c.cek.forEach(function(q,qi){
          var fs=el('fieldset','q'),lg=el('legend','',(qi+1)+'. '+q.tanya),op=el('div','opts'),fb=el('p','fb');fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');
          fs.appendChild(lg);
          q.opsi.forEach(function(t,oi){
            var b=el('button','opt',t);b.type='button';
            b.addEventListener('click',function(){
              var ok=oi===q.benar;answered++;if(ok)right++;
              Array.prototype.forEach.call(op.children,function(x,xi){x.disabled=true;if(xi===q.benar)x.classList.add('ok');else if(xi===oi)x.classList.add('no')});
              fb.textContent='';var bb=el('b','',ok?'Benar. ':'Belum tepat. ');fb.appendChild(bb);fb.appendChild(document.createTextNode(q.jelas));
              score.textContent=answered===c.cek.length?('Skor: '+right+' dari '+c.cek.length):('Dijawab '+answered+' dari '+c.cek.length);
            });
            op.appendChild(b)});
          fs.appendChild(op);fs.appendChild(fb);body.appendChild(fs)});
        body.appendChild(score)}
      if(c.ringkasan){body.appendChild(el('h2','','Ringkasan'));var ul=el('ul','sum');c.ringkasan.forEach(function(t){ul.appendChild(el('li','',t))});body.appendChild(ul)}
      ready();
    }).catch(function(){body.textContent='';body.appendChild(el('p','','Isi pelajaran gagal dimuat. Muat ulang halaman ini.'));ready()});
  }
  function show(flat,i){
    var cur=flat[i],p=cur.p,prev=flat[i-1],next=flat[i+1],mod=cur.m.pelajaran;
    document.title=p.judul+' — NERUVIA';
    main.textContent='';
    var cr=el('nav','crumb');cr.setAttribute('aria-label','Lokasi');
    var a1=el('a','','Level '+cur.l.nomor+' · '+cur.l.judul);a1.href='index.html';cr.appendChild(a1);cr.appendChild(el('span','','/'));cr.appendChild(el('span','',cur.m.judul));
    main.appendChild(cr);
    main.appendChild(el('h1','',p.judul));
    var meta=el('div','meta');meta.appendChild(el('span','pill',p.jenis.toUpperCase()));meta.appendChild(el('span','pill xp',p.xp+' XP'));
    var st=el('span','pill ok','SELESAI');meta.appendChild(st);main.appendChild(meta);

    var mp=el('div','mprog'),tt=el('div','t'),t1=el('span'),t2=el('span'),tr=el('div','track'),bar=el('i');
    tt.appendChild(t1);tt.appendChild(t2);tr.setAttribute('role','progressbar');tr.setAttribute('aria-label','Progres modul');tr.setAttribute('aria-valuemin','0');tr.setAttribute('aria-valuemax',String(mod.length));
    tr.appendChild(bar);mp.appendChild(tt);mp.appendChild(tr);main.appendChild(mp);

    var body=el('section','body');body.setAttribute('aria-label','Isi pelajaran');
    if(p.isi==='belum'){body.appendChild(el('span','draft','// Materi sedang disusun'));body.appendChild(el('p','','Isi pelajaran ini belum tersedia. Tombol di bawah hanya untuk mencoba alur belajar: tandai selesai, lihat progres, lanjut ke pelajaran berikutnya.'))}
    else body.appendChild(el('p','','Memuat isi pelajaran…'));
    main.appendChild(body);

    /* Tombol, status, dan navigasi ada di bawah isi. Isi tiba lewat fetch kedua dan memanjang jauh,
       jadi bagian bawah dipasang sesudah isi siap supaya tidak melompat (CLS). Sampai saat itu ia ditampung di fragmen. */
    var tail=document.createDocumentFragment();
    function showTail(){main.appendChild(tail)}
    var acts=el('div','acts'),done=el('button','btn main');done.type='button';
    acts.appendChild(done);tail.appendChild(acts);
    var live=el('p','live');live.setAttribute('role','status');live.setAttribute('aria-live','polite');tail.appendChild(live);

    var nav=el('div','nav2');
    function link(x,label,dir){var a=el('a','btn');a.textContent=label;if(x){a.href='pelajaran.html?id='+encodeURIComponent(x.p.id);a.title=x.p.judul}else{a.setAttribute('aria-disabled','true');a.removeAttribute('href')}return a}
    nav.appendChild(link(prev,'← Sebelumnya'));nav.appendChild(link(next,'Berikutnya →'));tail.appendChild(nav);

    function paint(announce){
      var on=window.NVProgress.isDone(p.id);
      done.setAttribute('aria-pressed',on);done.textContent=on?'Selesai · batalkan':'Tandai selesai (+'+p.xp+' XP)';
      st.style.display=on?'':'none';
      var s=window.NVProgress.summary(mod);
      t1.textContent=s.done+' dari '+s.count+' pelajaran di modul ini';t2.textContent=s.xp+' / '+s.xpTotal+' XP';
      bar.style.width=Math.round(100*s.done/s.count)+'%';tr.setAttribute('aria-valuenow',String(s.done));
      if(announce)live.textContent=on?('Tersimpan. +'+p.xp+' XP.'+(next?' Lanjut ke pelajaran berikutnya.':'')):'Penanda selesai dibatalkan.';
    }
    done.addEventListener('click',function(){
      var ok=window.NVProgress.mark(p.id,!window.NVProgress.isDone(p.id));
      if(!ok){live.style.color='var(--bad)';live.textContent='Progres tidak bisa disimpan di browser ini.';return}
      live.style.color='';paint(true)});
    paint(false);
    if(p.isi==='belum')showTail();else loadContent(p,body,showTail);
  }
})();
</script>
</body>
</html>
