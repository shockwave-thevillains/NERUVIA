<script>
/* Vercel dan domain sendiri: situs ada di akar, jadi rujukan "/..." sudah benar.
   GitHub Pages situs proyek (<akun>.github.io/<repo>/): sisipkan /<repo> di depan rujukan, termasuk font.
   Segmen alamat hanya dipakai bila lolos daftar putih; alamat tidak pernah ditampilkan di halaman. */
(function(){
  if(!/\.github\.io$/i.test(location.hostname))return;
  var seg=location.pathname.split('/')[1]||'';
  if(!/^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$/.test(seg))return;
  var dasar='/'+seg;
  document.querySelectorAll('[href],[src],[srcset]').forEach(function(el){
    ['href','src','srcset'].forEach(function(n){
      var v=el.getAttribute(n);
      if(v)el.setAttribute(n,v.replace(/(^|,\s*)\/(?!\/)/g,'$1'+dasar+'/'));
    });
  });
  if(window.FontFace&&document.fonts){
    [['Space Grotesk','SpaceGrotesk-latin','300 700'],['Space Mono','SpaceMono-400-latin','400'],['Silkscreen','Silkscreen-400-latin','400']].forEach(function(f){
      var muka=new FontFace(f[0],'url('+dasar+'/assets/fonts/'+f[1]+'.woff2) format("woff2")',{weight:f[2],display:'swap'});
      document.fonts.add(muka);
      muka.load().catch(function(){});
    });
  }
})();
</script>
